name: Encrypt and Push

on:
  workflow_dispatch:

jobs:
  encrypt-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (with token)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install cryptography
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Encrypt all files
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          python crypto_utils.py encrypt-all || true

      - name: Commit encrypted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: encrypt Python sources (CI)" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed or no changes"
