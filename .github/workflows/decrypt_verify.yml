name: Decrypt and Verify
on:
  workflow_dispatch:

jobs:
  decrypt-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: pip install cryptography
      
      - run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "ERROR: ENCRYPTION_KEY is not set"
            exit 1
          fi
          echo "Decrypting files..."
          python crypto_utils.py decrypt-all
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      
      - run: |
          echo "Checking decrypted files..."
          find . -name "*.py" -type f -not -path "./.git/*" -not -name "crypto_utils.py" -not -name "secure_bootstrap.py" | head -20
      
      - run: |
          echo "Verifying Python syntax..."
          python -m py_compile agents/astrologer.py 2>/dev/null && echo "OK" || echo "Files not decrypted"
        continue-on-error: true
