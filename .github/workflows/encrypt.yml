name: 🔐 Encrypt Project on Push

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encrypt-source-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Encryption Key
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "❌ ERROR: ENCRYPTION_KEY secret is not set!"
            echo "Please add ENCRYPTION_KEY to GitHub Secrets:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          
          echo "✓ ENCRYPTION_KEY is set (length: ${#ENCRYPTION_KEY})"
          
          # Validate key format
          python setup_encryption_key.py validate "$ENCRYPTION_KEY"
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: ENCRYPTION_KEY is not a valid Fernet key!"
            echo ""
            echo "Generate a new valid key:"
            echo "  python setup_encryption_key.py generate"
            echo ""
            echo "Then add it to GitHub Secrets:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          
          echo "✓ ENCRYPTION_KEY is valid"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install cryptography -q

      - name: Check if already encrypted
        run: |
          if [ -f "agents/astrologer.encrypted.py" ]; then
            echo "✓ Files already encrypted, skipping"
            echo "SKIP_ENCRYPTION=true" >> $GITHUB_ENV
          else
            echo "✗ Files not encrypted yet, proceeding"
            echo "SKIP_ENCRYPTION=false" >> $GITHUB_ENV
          fi

      - name: Encrypt all Python files
        if: env.SKIP_ENCRYPTION == 'false'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "📦 Starting encryption process..."
          echo "ENCRYPTION_KEY length: ${#ENCRYPTION_KEY}"
          echo "ENCRYPTION_KEY first 10 chars: ${ENCRYPTION_KEY:0:10}"
          
          # Validate key format (should start with gAAAAAB for Fernet)
          if [[ ! "$ENCRYPTION_KEY" =~ ^gAAAAAB ]]; then
            echo "⚠️  WARNING: ENCRYPTION_KEY may not be a valid Fernet key"
            echo "   Expected format: gAAAAAB... (Fernet key)"
            echo "   See: https://github.com/${{ github.repository }}/settings/secrets/actions"
          fi
          
          # Run encryption with verbose output
          python -u crypto_utils.py encrypt-all 2>&1
          ENCRYPT_EXIT=$?
          
          if [ $ENCRYPT_EXIT -ne 0 ]; then
            echo "❌ Encryption failed with exit code: $ENCRYPT_EXIT"
            exit $ENCRYPT_EXIT
          fi
          
          echo "✓ Encryption complete"
          echo ""
          echo "📊 Root encrypted files:"
          ls -lh *.encrypted.py 2>/dev/null || echo "  (none)"
          echo ""
          echo "📊 Agent encrypted files:"
          ls -lh agents/*.encrypted.py 2>/dev/null || echo "  (none)"
          echo ""
          echo "📊 Unencrypted bootstrap files (expected):"
          ls -lh crypto_utils.py secure_bootstrap.py 2>/dev/null || echo "  (missing)"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push encrypted files
        if: env.SKIP_ENCRYPTION == 'false'
        run: |
          echo "📝 Checking for changes..."
          git status
          
          if git diff --quiet --cached; then
            echo "✓ No new encrypted files to commit"
          else
            echo "📤 Committing encrypted files..."
            git add -A
            git commit -m "🔐 Auto-encrypt project source code [skip ci]"
            git push origin main
            echo "✓ Push successful!"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "🔐 Encryption Workflow Complete"
          echo "═══════════════════════════════════════════"
          if [ "${{ env.SKIP_ENCRYPTION }}" = "true" ]; then
            echo "Status: ✓ Already Encrypted (No action needed)"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Status: ✓ Successfully Encrypted"
          else
            echo "Status: ❌ Encryption Failed"
            echo "Check logs above for details"
          fi
          echo ""
