name: 🔐 Encrypt Project on Push

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encrypt-source-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies  
        run: pip install cryptography -q

      - name: Validate Encryption Key and Generate If Needed
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          python << 'EOF'
          import os
          from cryptography.fernet import Fernet
          
          encryption_key = os.getenv("ENCRYPTION_KEY", "").strip()
          
          if not encryption_key:
              print("📋 No ENCRYPTION_KEY found. Generating new valid key...")
              new_key = Fernet.generate_key().decode()
              with open("/tmp/encryption_key.txt", "w") as f:
                  f.write(new_key)
              print(f"Generated key: {new_key[:20]}...")
              with open(os.getenv("GITHUB_ENV"), "a") as env:
                  env.write(f"NEW_ENCRYPTION_KEY={new_key}\n")
                  env.write("KEY_ACTION=UPDATE_NEEDED\n")
          else:
              # Validate existing key
              try:
                  Fernet(encryption_key.encode())
                  print("✓ ENCRYPTION_KEY is valid!")
                  with open(os.getenv("GITHUB_ENV"), "a") as env:
                      env.write("KEY_ACTION=VALID\n")
              except Exception as e:
                  print(f"⚠️ Invalid key: {str(e)}")
                  print(f"Key starts with: {encryption_key[:20]}")
                  print("Generating new valid key...")
                  new_key = Fernet.generate_key().decode()
                  with open("/tmp/encryption_key.txt", "w") as f:
                      f.write(new_key)
                  with open(os.getenv("GITHUB_ENV"), "a") as env:
                      env.write(f"NEW_ENCRYPTION_KEY={new_key}\n")
                      env.write("KEY_ACTION=INVALID\n")
          EOF

      - name: Display Key Instructions
        if: env.KEY_ACTION != 'VALID'
        run: |
          # Create the encryption_key artifact file
          mkdir -p /tmp/artifact
          cat /tmp/encryption_key.txt > /tmp/artifact/ENCRYPTION_KEY.txt
          
          # Also display in logs
          echo "=========================================="
          echo "🔐 ENCRYPTION KEY UPDATE REQUIRED"
          echo "=========================================="
          echo ""
          echo "Copy this key:"
          echo ""
          cat /tmp/encryption_key.txt
          echo ""
          echo "=========================================="
          echo ""
          echo "Steps to update GitHub Secrets:"
          echo "1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo "2. Click 'New repository secret' (if ENCRYPTION_KEY doesn't exist)"
          echo "   OR click the pencil icon next to ENCRYPTION_KEY (if it exists)"
          echo "3. Name: ENCRYPTION_KEY"
          echo "4. Paste the key above into the Value field"
          echo "5. Click 'Add secret' or 'Update secret'"
          echo "6. The workflow will auto-trigger on next push"
          echo ""

      - name: Upload Encryption Key (if needed)
        if: env.KEY_ACTION != 'VALID'
        uses: actions/upload-artifact@v4
        with:
          name: encryption-key
          path: /tmp/artifact/ENCRYPTION_KEY.txt
          retention-days: 7

      - name: Check if already encrypted
        if: env.KEY_ACTION == 'VALID'
        run: |
          if [ -f "agents/astrologer.encrypted.py" ]; then
            echo "✓ Files already encrypted, skipping"
            echo "SKIP_ENCRYPTION=true" >> $GITHUB_ENV
          else
            echo "✗ Files not encrypted yet, proceeding"
            echo "SKIP_ENCRYPTION=false" >> $GITHUB_ENV
          fi

      - name: Encrypt all Python files
        if: env.KEY_ACTION == 'VALID' && env.SKIP_ENCRYPTION == 'false'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "📦 Starting encryption process..."
          echo "ENCRYPTION_KEY length: ${#ENCRYPTION_KEY}"
          echo "ENCRYPTION_KEY first 10 chars: ${ENCRYPTION_KEY:0:10}"
          
          # Validate key format (should start with gAAAAAB for Fernet)
          if [[ ! "$ENCRYPTION_KEY" =~ ^gAAAAAB ]]; then
            echo "⚠️  WARNING: ENCRYPTION_KEY may not be a valid Fernet key"
            echo "   Expected format: gAAAAAB... (Fernet key)"
            echo "   See: https://github.com/${{ github.repository }}/settings/secrets/actions"
          fi
          
          # Run encryption with verbose output
          python -u crypto_utils.py encrypt-all 2>&1
          ENCRYPT_EXIT=$?
          
          if [ $ENCRYPT_EXIT -ne 0 ]; then
            echo "❌ Encryption failed with exit code: $ENCRYPT_EXIT"
            exit $ENCRYPT_EXIT
          fi
          
          echo "✓ Encryption complete"
          echo ""
          echo "📊 Root encrypted files:"
          ls -lh *.encrypted.py 2>/dev/null || echo "  (none)"
          echo ""
          echo "📊 Agent encrypted files:"
          ls -lh agents/*.encrypted.py 2>/dev/null || echo "  (none)"
          echo ""
          echo "📊 Unencrypted bootstrap files (expected):"
          ls -lh crypto_utils.py secure_bootstrap.py 2>/dev/null || echo "  (missing)"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push encrypted files
        if: env.KEY_ACTION == 'VALID' && env.SKIP_ENCRYPTION == 'false'
        run: |
          echo "📝 Checking for changes..."
          git status
          
          if git diff --quiet --cached; then
            echo "✓ No new encrypted files to commit"
          else
            echo "📤 Committing encrypted files..."
            git add -A
            git commit -m "🔐 Auto-encrypt project source code [skip ci]"
            git push origin main
            echo "✓ Push successful!"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "🔐 Encryption Workflow Complete"
          echo "═══════════════════════════════════════════"
          if [ "${{ env.SKIP_ENCRYPTION }}" = "true" ]; then
            echo "Status: ✓ Already Encrypted (No action needed)"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Status: ✓ Successfully Encrypted"
          else
            echo "Status: ❌ Encryption Failed"
            echo "Check logs above for details"
          fi
          echo ""
