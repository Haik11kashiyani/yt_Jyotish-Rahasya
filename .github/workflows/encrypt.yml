name: 🔐 Encrypt Project on Push

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encrypt-source-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install cryptography

      - name: Check if already encrypted
        run: |
          if [ -f "agents/astrologer.encrypted.py" ]; then
            echo "✓ Files already encrypted, skipping"
            echo "SKIP_ENCRYPTION=true" >> $GITHUB_ENV
          else
            echo "✗ Files not encrypted yet, proceeding"
            echo "SKIP_ENCRYPTION=false" >> $GITHUB_ENV
          fi

      - name: Encrypt all Python files
        if: env.SKIP_ENCRYPTION == 'false'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "ENCRYPTION_KEY length: ${#ENCRYPTION_KEY}"
          python crypto_utils.py encrypt-all
          echo "✓ Encryption complete"
          ls -la *.encrypted.py 2>/dev/null || echo "No root encrypted files"
          ls -la agents/*.encrypted.py 2>/dev/null || echo "No agent encrypted files"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push encrypted files
        if: env.SKIP_ENCRYPTION == 'false'
        run: |
          git add -A
          git status
          git commit -m "🔐 Auto-encrypt project source code" || echo "No changes to commit"
          git push origin main || echo "Push failed - may have been encrypted already"
