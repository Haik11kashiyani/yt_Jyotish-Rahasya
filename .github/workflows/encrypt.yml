name: 🔐 Encrypt Project on Push

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encrypt-all:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cryptography
        run: pip install --quiet cryptography

      - name: Check if files need encryption
        run: |
          if [ -f "agents/astrologer.encrypted.py" ]; then
            echo "STATUS=ALREADY_ENCRYPTED" >> $GITHUB_ENV
          else
            echo "STATUS=NEEDS_ENCRYPTION" >> $GITHUB_ENV
          fi

      - name: Display encryption key status
        run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "❌ ERROR: ENCRYPTION_KEY is not set!"
            exit 1
          else
            echo "✓ ENCRYPTION_KEY is set (length: ${#ENCRYPTION_KEY})"
          fi
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      - name: Encrypt all Python files
        if: env.STATUS == 'NEEDS_ENCRYPTION'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "🔐 Starting encryption..."
          python crypto_utils.py encrypt-all
          echo "✓ Encryption complete"
          
          echo ""
          echo "Encrypted files created:"
          find . -name "*.encrypted.py" -type f | head -20
          
          echo ""
          echo "Remaining unencrypted .py files (should be only bootstrap):"
          find . -name "*.py" -type f | grep -v ".encrypted.py" | grep -v "__pycache__" | sort

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push encrypted files
        if: env.STATUS == 'NEEDS_ENCRYPTION'
        run: |
          git add -A
          git status
          
          if [ -n "$(git diff --cached)" ]; then
            git commit -m "🔐 Auto-encrypt source code - all 15 Python modules encrypted"
            git push origin main
            echo "✓ Encrypted files committed and pushed"
          else
            echo "✓ No changes needed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
