name: Daily Rashifal - Batch 1 (Mesh, Vrushabh, Mithun)
on:
  workflow_dispatch:
  schedule:
    # 2:30 AM IST = 21:00 UTC (previous day)
    - cron: "0 21 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  produce-video:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        rashi: ["Mesh (Aries)", "Vrushabh (Taurus)", "Mithun (Gemini)"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Cache HuggingFace MMS-TTS Hindi Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-tts-hin-v1
          restore-keys: hf-mms-tts-hin-v1

      - name: Pre-Download MMS-TTS Hindi Model
        run: |
          python -c "
          from transformers import VitsModel, AutoTokenizer
          AutoTokenizer.from_pretrained('facebook/mms-tts-hin')
          VitsModel.from_pretrained('facebook/mms-tts-hin')
          print('MMS-TTS Hindi model ready!')
          "

      - name: Install Dependencies (Including Cryptography)
        run: |
          pip install cryptography

      - name: 🔓 Decrypt All Modules
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "❌ ERROR: ENCRYPTION_KEY secret not set!"
            echo "   Add ENCRYPTION_KEY to GitHub Secrets: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "🔐 Decrypting all modules..."
          python -c "
          from crypto_utils import ModuleEncryptor
          import os
          
          key = os.getenv('ENCRYPTION_KEY')
          if not key:
              raise ValueError('ENCRYPTION_KEY not set')
          
          encryptor = ModuleEncryptor(key)
          count = encryptor.decrypt_all('.')
          if count == 0:
              print('⚠️  Warning: No encrypted files found')
          else:
              print(f'\u2705 Successfully decrypted {count} files')
          "

      - name: Rate Limit Cooldown (4 Mins)
        run: |
          echo "⏳ Waiting 4 minutes for rate limits..."
          sleep 240

      - name: Run Production Studio
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_BACKUP: ${{ secrets.OPENROUTER_API_KEY_BACKUP }}
          OPENROUTER_API_KEY_BACKUP_2: ${{ secrets.OPENROUTER_API_KEY_BACKUP_2 }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py --rashi "${{ matrix.rashi }}" --type shorts --upload

      - name: 🧹 Cleanup Decrypted Files
        if: always()
        run: |
          python -c "
          from crypto_utils import cleanup_decrypted_files
          cleanup_decrypted_files('.')
          "
